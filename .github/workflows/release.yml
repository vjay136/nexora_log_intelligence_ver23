name: Verify local-first NLI release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published local-first release tag to verify
        required: true
        default: v23.0.0-5
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Verify the published local artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release
          cd release
          sha256sum -c SHA256SUMS
